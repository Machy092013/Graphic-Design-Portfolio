<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Name · GFX</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #111;
    color: #fff;
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    padding: 32px 40px 60px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .site-name {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }

  .socials {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .social-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    font-weight: 700;
    color: #ccc;
    text-decoration: none;
    transition: color 0.15s;
  }

  .social-row:hover { color: #fff; }

  .social-row svg { flex-shrink: 0; }

  /* ── SECTION TITLES ── */
  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .section-title {
    font-size: 1.5rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .price-tag {
    font-size: 1rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .robux {
    color: #4ade80;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .paypal {
    color: #60a5fa;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Robux icon */
  .robux-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    gap: 10px;
    margin-bottom: 40px;
  }

  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }

  /* ── CARD ── */
  .card {
    background: #1e1e1e;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 16/9;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
    position: relative;
  }

  /* Square cards for profile pictures */
  .card.square { aspect-ratio: 1/1; }
  /* Wide cards for banners */
  .card.banner { aspect-ratio: 3/1; }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Placeholder shown when no image */
  .card-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 2px dashed #2a2a2a;
    border-radius: 10px;
    user-select: none;
  }

  /* Divider */
  hr {
    border: none;
    border-top: 1px solid #2a2a2a;
    margin: 8px 0 40px;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    color: #444;
    font-size: 0.75rem;
    font-weight: 700;
    margin-top: 20px;
  }

  @media (max-width: 700px) {
    body { padding: 16px 12px 40px; }
    header { flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 28px; }
    .site-name { font-size: 2rem; }
    .section-header { flex-direction: column; align-items: flex-start; gap: 4px; }
    .section-title { font-size: 1.2rem; }
    .price-tag { font-size: 0.9rem; }
    .grid-2 { grid-template-columns: 1fr; }
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) {
    .grid-3 { grid-template-columns: 1fr; }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
